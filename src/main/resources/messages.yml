# AntiRedstoneLag Messages
# Supports & color codes, MiniMessage tags, and &#RRGGBB hex colors

alerts:
  chunk-lockdown-admin: "&#FF6B6B[!] &cChunk Lockdown Triggered! &7World: &e{world} &7Chunk: &e{chunkX}, {chunkZ} &7Duration: &e{duration}s"
  chunk-lockdown-local: "&#FF6B6B[!] &cThe chunk you are standing in has been locked down for &e{duration}s &cdue to extreme redstone lag!"
  clock-frozen: "&#FFD93D⚠ &eClock at &6{x}, {y}, {z} &epause-throttled for &c{duration}s &e(high frequency). Auto-resuming soon."
  clock-resumed: "&#4ECDC4✓ &aClock at &6{x}, {y}, {z} &ahas resumed operation."
  redstone-removed: |-
    &#FF6B6B┌─ &c⚠ Lag Machine Detected &7─┐
    &7│ &6Coordinates: &e{x}, {y}, {z} &7│
    &7│ &6World: &e{world} &7│
    &7│ &6Block: &e{material} &7│
    &7│ &6Chunk Updates: &e{chunk_count} &7│ &6Block Updates: &e{block_count} &7│
    &#FF6B6B└─ &7Removed for server performance ─┘
  redstone-warning: "&#FFD93D⚠ &eWarning: &7Redstone activity at &e{x}, {y}, {z} &7is at &c{percent}% &7of threshold!"

commands:
  reload-success: "&#4ECDC4✓ &aConfiguration and messages reloaded successfully!"
  stats: |-
    &#4ECDC4┌─ &bAntiRedstoneLag Statistics &7─┐
    &7Chunks monitored: &e{chunks}
    &7Blocks monitored: &e{blocks}
    &7Total removals: &e{total_removals}
    &7Removals today: &e{today_removals}
    &7Performance: &a{performance}%
    &#4ECDC4└────────────────────────┘
  logs-info: |-
    &#4ECDC4Logging System Information:
    &7Status: {status}
    &7Log folder: &e{folder}
    &7Use &6/arl logs download &7to get latest log file
  logs-download: "&#4ECDC4✓ &aLog file has been prepared for download!"
  logs-no-folder: "&#FF6B6B✗ &cLogs folder not found!"
  logs-empty: "&#FF6B6B✗ &cNo log files found!"
  logs-file-info: |-
    &#4ECDC4┌─ &bLatest Log File &7─┐
    &7File: &e{filename}
    &7Size: &e{size}
    &7Modified: &e{modified}
    &7Path: &e{path}
    &#4ECDC4└────────────────────┘
  hotspots-header: "&#4ECDC4┌─ &bRedstone Hotspots &7({count} clusters) ───┐"
  hotspots-none: "&#4ECDC4✓ &aNo active redstone hotspots detected!"
  hotspots-exported: "&#4ECDC4✓ &aHotspot map exported to: &e{path}"
  inspect-enabled: "&#4ECDC4✓ &aReal-time redstone inspector enabled for &e{duration}s&a! Particles show active components."
  inspect-disabled: "&#FF6B6B✗ &cReal-time redstone inspector disabled."
  inspect-actionbar: "<gold>ARL Inspect <dark_gray>| <yellow>Chunk: <aqua>{chunk_ups} UPS <dark_gray>| <yellow>Top Block: <red>{block_ups} UPS <gray>({material})"
  no-permission: "&#FF6B6B✗ &cYou don't have permission to use this command!"
  help: |-
    &#FFD93D┌─ &6AntiRedstoneLag &7v{version} ──────────┐
    &6/arl reload    &7- Reload configuration and messages
    &6/arl stats     &7- View plugin statistics
    &6/arl logs      &7- View or download logs
    &6/arl hotspots  &7- View top redstone hotspots
    &6/arl inspect   &7- Toggle real-time redstone HUD & particles
    &6/arl help      &7- Show this help message
    &#FFD93D└──────────────────────────────────────┘

messages:
  prefix: "&#4ECDC4[ARL]&r "
  enabled: "&#4ECDC4✓ &aAntiRedstoneLag v{version} has been enabled!"
  disabled: "&#FF6B6B✗ &cAntiRedstoneLag has been disabled!"
  update-available-console: "A new version is available: v{version} (current: v{current})"
  update-download-console: "Download at: {url}"
  update-available-player: "<gold>[AntiRedstoneLag] <yellow>A new version is available: <green>v{version}"
  update-download-player: "<gold>[AntiRedstoneLag] <gray>Download at: <aqua><click:open_url:'{url}'>{url}</click>"