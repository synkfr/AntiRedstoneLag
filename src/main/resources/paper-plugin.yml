name: AntiRedstoneLag
version: '${project.version}'
main: org.ayosynk.antiRedstoneLag.AntiRedstoneLag
loader: org.ayosynk.antiRedstoneLag.bootstrap.PluginLibraryLoader
api-version: '1.21'
description: Redstone lag prevention, diagnostics, and entity cleanup for Paper and Folia
authors:
  - AyoSynk
website: https://modrinth.com/plugin/antiredstonelag
folia-supported: true
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  antiredstonelag.*:
    description: All AntiRedstoneLag permissions
    default: op
    children:
      antiredstonelag.use: true
      antiredstonelag.reload: true
      antiredstonelag.stats: true
      antiredstonelag.logs: true
      antiredstonelag.alerts: true
      antiredstonelag.redstone: true
      antiredstonelag.bypass: true
      antiredstonelag.hotspots: true
      antiredstonelag.inspect: true
      antiredstonelag.snapshot: true
      antiredstonelag.clear: true
      antiredstonelag.gui: true
      antiredstonelag.control: true
      antiredstonelag.admin: true
  antiredstonelag.use:
    description: Use basic plugin commands
    default: true
  antiredstonelag.reload:
    description: Reload plugin configuration
    default: op
  antiredstonelag.stats:
    description: View plugin statistics
    default: op
  antiredstonelag.logs:
    description: Access logging system
    default: op
  antiredstonelag.alerts:
    description: Receive and toggle redstone alerts
    default: op
  antiredstonelag.redstone:
    description: Toggle redstone protection and notification-only mode
    default: op
  antiredstonelag.bypass:
    description: Bypass redstone limits
    default: false
  antiredstonelag.hotspots:
    description: View and export redstone hotspot map
    default: op
  antiredstonelag.inspect:
    description: Toggle live redstone inspector particles and BossBar
    default: op
  antiredstonelag.snapshot:
    description: View and manage forensic lag snapshots
    default: op
  antiredstonelag.clear:
    description: Clear ground items and lag entities
    default: op
  antiredstonelag.gui:
    description: Open the interactive AntiRedstoneLag staff panel
    default: op
  antiredstonelag.control:
    description: Manually unfreeze clocks, unlock chunks, and edit chunk whitelist
    default: op
  antiredstonelag.admin:
    description: Receive update notifications
    default: op
