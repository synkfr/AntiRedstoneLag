# AntiRedstoneLag Configuration
# Advanced redstone lag prevention system

# Internal configuration version - do not modify
config-version: "26.2"

# Maximum redstone updates per chunk per reset interval
chunk-threshold: 500

# Updates per block before being considered a lag machine
block-threshold: 15

# Counter reset interval in ticks (20 ticks = 1 second)
reset-interval-ticks: 20

# Enable debug mode for verbose logging
debug: false

# Action to take when redstone exceeds threshold
# Options: FREEZE (temporarily pause clock), DISABLE (cancel signal), DROP (break and drop item), REMOVE (set to air)
removal-action: FREEZE

# High-performance ground item & entity cleaner with countdown broadcasts
clearlagg:
  enabled: true
  # Automatic clear interval in seconds (300 = 5 minutes, 0 = disabled)
  interval-seconds: 300
  # Seconds before clear to broadcast countdown warnings
  countdown-seconds:
    - 60
    - 30
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1
  # Broadcast display type: CHAT, ACTION_BAR, TITLE, SUBTITLE, ALL, NONE
  broadcast-mode: CHAT
  clear-ground-items: true
  # Entities to remove during clear (supports conditions: onGround, !isMounted, !hasName, !isTamed, !isLeashed, liveTime>100)
  remove-entities:
    - "Arrow onGround"
    - "Spectral_Arrow onGround"
    - "Trident onGround"
    - "Snowball"
    - "Egg"
    - "Ender_Pearl"
    - "Experience_Bottle"
    - "Fireball"
    - "Small_Fireball"
    - "Dragon_Fireball"
    - "Wither_Skull"
    - "Shulker_Bullet"
    - "Boat !isMounted"
    - "Chest_Boat !isMounted"
    - "Minecart !isMounted"
    - "Minecart_Chest !isMounted"
    - "Minecart_Hopper !isMounted"
    - "Minecart_Tnt"
    - "Minecart_Furnace"
    - "Tnt liveTime>100"
  # Entities that are 100% immune from clearing (SMP safe)
  entity-whitelist:
    - "Player"
    - "Villager"
    - "Iron_Golem"
    - "Allay"
    - "Armor_Stand"
    - "Item_Frame"
    - "Glow_Item_Frame"
    - "Painting"
    - "Leash_Knot"
    - "Interaction"
    - "Text_Display"
    - "Block_Display"
    - "Item_Display"
    - "* hasName"
    - "* isTamed"
    - "* isLeashed"
    - "* isMounted"
  # Items that will NEVER be cleared when dropped on ground
  item-blacklist:
    - NETHER_STAR
    - BEACON
    - TOTEM_OF_UNDYING
    - ELYTRA
    - DIAMOND
    - DIAMOND_BLOCK
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - NETHERITE_SWORD
    - NETHERITE_PICKAXE
    - NETHERITE_AXE
    - NETHERITE_SHOVEL
    - NETHERITE_HOE
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS
  # Emergency auto-clear when server TPS drops below this value (0.0 to disable)
  tps-emergency-threshold: 0.0

# Forensic snapshot system - records 3D structure and culprit metadata when lag machines are detected
snapshot:
  enabled: true
  radius: 3
  max-snapshots: 25
  save-to-disk: true

# Non-destructive freezing system - temporarily pauses clocks before escalating
freeze:
  enabled: true
  duration-seconds: 15
  max-freeze-attempts: 3

# Adaptive performance scaling - adjusts thresholds dynamically based on MSPT and TPS
adaptive:
  enabled: true
  target-mspt: 40.0
  min-tps: 18.0
  healthy-headroom-multiplier: 1.5

# Clock fingerprinting - distinguishes periodic clocks from bursty sorting systems
fingerprint:
  enabled: true
  clock-strictness: 0.7

# Player proximity throttling - enforces stricter limits on unattended redstone
proximity:
  enabled: true
  player-radius: 96
  unattended-strict-multiplier: 0.6

# Lockdown system (EMP) - Prevents players from repeatedly triggering lag machines
lockdown:
  enabled: true
  # Duration in seconds to lock down the chunk when the threshold is exceeded
  duration-seconds: 60

# Warning system - warn players before removing their redstone
warning:
  enabled: true
  # Percentage of threshold at which to warn (e.g., 80 = warn at 80% of threshold)
  threshold-percent: 80

# Worlds where the plugin is active (use * for all worlds)
enabled-worlds:
  - "*"

# Whitelist mode - only monitor specific chunks instead of all chunks
whitelist:
  enabled: false
  chunks:
    - "world:0:0"

# Alert settings
alerts:
  enabled: true
  log-to-console: true

# Advanced logging system
logging:
  enabled: true
  console-mirror: false
  max-files: 10
  max-size-mb: 10
  performance-stats: true

# Redstone components to monitor
redstone-components:
  - REDSTONE_WIRE
  - REPEATER
  - COMPARATOR
  - OBSERVER
  - PISTON
  - STICKY_PISTON
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - LEVER
  - DAYLIGHT_DETECTOR
  - TARGET
  - TRAPPED_CHEST
  - DROPPER
  - DISPENSER
  - HOPPER
  - CRAFTER
  - COPPER_BULB
  - EXPOSED_COPPER_BULB
  - WEATHERED_COPPER_BULB
  - OXIDIZED_COPPER_BULB
  - WAXED_COPPER_BULB
  - WAXED_EXPOSED_COPPER_BULB
  - WAXED_WEATHERED_COPPER_BULB
  - WAXED_OXIDIZED_COPPER_BULB
  - SCULK_SENSOR
  - CALIBRATED_SCULK_SENSOR
  - CHISELED_BOOKSHELF