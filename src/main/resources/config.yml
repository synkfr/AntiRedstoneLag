# AntiRedstoneLag v2 Configuration
# Redstone lag prevention, forensic diagnostics, Staff GUI, and ClearLagg

# Internal configuration version - do not modify
config-version: 2

# Maximum redstone updates per chunk per reset interval
chunk-threshold: 800

# Updates per block before being considered a lag machine
block-threshold: 30

# Counter reset interval in ticks (20 ticks = 1 second)
reset-interval-ticks: 20

# Enable debug mode for verbose logging
debug: false

# Enable redstone protection and monitoring (toggleable via /arl redstone on|off|notify)
redstone-enabled: true

# Action to take when redstone exceeds threshold
# Options: FREEZE, NOTIFY, DISABLE, DROP, REMOVE
removal-action: FREEZE

# Persistent storage for block owners, forensic snapshots, and statistics
storage:
  backend: AUTO
  sqlite-file: "data/antiredstonelag.db"
  persist-owners: true
  persist-snapshots: true
  owner-retention-days: 30

# Ground item and entity cleaner with countdown broadcasts
clearlagg:
  enabled: true
  interval-seconds: 300
  countdown-seconds:
    - 60
    - 30
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1
  broadcast-mode: CHAT
  clear-ground-items: true
  min-item-age-seconds: 30
  merge-items: false
  chunk-entity-caps:
    enabled: false
    max-mobs-per-chunk: 40
    max-items-per-chunk: 100
  remove-entities:
    - "Arrow onGround"
    - "Spectral_Arrow onGround"
    - "Trident onGround"
    - "Snowball"
    - "Egg"
    - "Ender_Pearl"
    - "Experience_Bottle"
    - "Fireball"
    - "Small_Fireball"
    - "Dragon_Fireball"
    - "Wither_Skull"
    - "Shulker_Bullet"
    - "Tnt_Minecart"
    - "Tnt liveTime>100"
  entity-whitelist:
    - "Player"
    - "Villager"
    - "Iron_Golem"
    - "Allay"
    - "Armor_Stand"
    - "Item_Frame"
    - "Glow_Item_Frame"
    - "Painting"
    - "Leash_Knot"
    - "Interaction"
    - "Text_Display"
    - "Block_Display"
    - "Item_Display"
    - "Hopper_Minecart"
    - "Chest_Minecart"
    - "Furnace_Minecart"
    - "* hasName"
    - "* isTamed"
    - "* isLeashed"
    - "* isMounted"
  item-blacklist:
    - NETHER_STAR
    - BEACON
    - TOTEM_OF_UNDYING
    - ELYTRA
    - DIAMOND
    - DIAMOND_BLOCK
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - NETHERITE_SWORD
    - NETHERITE_PICKAXE
    - NETHERITE_AXE
    - NETHERITE_SHOVEL
    - NETHERITE_HOE
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS
  tps-emergency-threshold: 0.0

# Forensic snapshot system
snapshot:
  enabled: true
  radius: 3
  max-snapshots: 25
  save-to-disk: true

# Non-destructive freezing system
freeze:
  enabled: true
  duration-seconds: 15
  max-freeze-attempts: 3
  notify-on-resume: true

# Adaptive performance scaling
adaptive:
  enabled: true
  target-mspt: 40.0
  min-tps: 18.0
  healthy-headroom-multiplier: 1.5

# Multi-pattern clock fingerprinting
fingerprint:
  enabled: true
  clock-strictness: 0.85
  history-size: 8
  max-interval-ms: 500
  variance-tolerance-ms: 45

# Specialized lag detectors
detectors:
  piston-loop-threshold: 16
  hopper-limiter:
    enabled: false
    max-transfers-per-interval: 64
  crafter-limiter:
    enabled: true
    max-crafts-per-interval: 40
  minecart-cluster:
    enabled: true
    max-minecarts-per-block: 16
    action: REMOVE_EXCESS

# Player proximity throttling
proximity:
  enabled: true
  player-radius: 96
  unattended-strict-multiplier: 0.8

# Lockdown system (EMP)
lockdown:
  enabled: true
  duration-seconds: 60

# Owner threshold warning system
warning:
  enabled: true
  threshold-percent: 80

# Visual in-world redstone inspector (/arl inspect)
inspector:
  default-duration-seconds: 30
  max-duration-seconds: 300
  show-block-particles: true
  show-chunk-borders: true
  show-actionbar: true

# Interactive Staff Inventory GUI (/arl gui)
gui:
  enabled: true
  refresh-ticks: 20

# Worlds where the plugin is active (use * for all worlds)
enabled-worlds:
  - "*"

# Optional per-world threshold and action overrides
worlds: {}

# Whitelist mode - only monitor specific chunks when enabled
whitelist:
  enabled: false
  chunks:
    - "world:0:0"

# Alert settings
alerts:
  enabled: true
  log-to-console: true
  notify-on-tps-lag: true
  only-when-lagging: false

# Async rotating file logging system
logging:
  enabled: true
  console-mirror: false
  max-files: 10
  max-size-mb: 10
  performance-stats: true

# External integrations
integrations:
  placeholderapi:
    enabled: true
  discord:
    enabled: false
    webhook-url: ""
    cooldown-seconds: 30
    events:
      - LOCKDOWN
      - TPS_LAG
      - REMOVAL
      - SNAPSHOT

# Redstone components to monitor
redstone-components:
  - REDSTONE_WIRE
  - REPEATER
  - COMPARATOR
  - OBSERVER
  - PISTON
  - STICKY_PISTON
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - LEVER
  - DAYLIGHT_DETECTOR
  - TARGET
  - TRAPPED_CHEST
  - DROPPER
  - DISPENSER
  - HOPPER
  - CRAFTER
  - COPPER_BULB
  - EXPOSED_COPPER_BULB
  - WEATHERED_COPPER_BULB
  - OXIDIZED_COPPER_BULB
  - WAXED_COPPER_BULB
  - WAXED_EXPOSED_COPPER_BULB
  - WAXED_WEATHERED_COPPER_BULB
  - WAXED_OXIDIZED_COPPER_BULB
  - SCULK_SENSOR
  - CALIBRATED_SCULK_SENSOR
  - CHISELED_BOOKSHELF
