# AntiRedstoneLag Configuration
# Advanced redstone lag prevention system

# Internal configuration version - do not modify
config-version: "26.2"

# Maximum redstone updates per chunk per reset interval
chunk-threshold: 500

# Updates per block before being considered a lag machine
block-threshold: 15

# Counter reset interval in ticks (20 ticks = 1 second)
reset-interval-ticks: 20

# Enable debug mode for verbose logging
debug: false

# Action to take when redstone exceeds threshold
# Options: FREEZE (temporarily pause clock), DISABLE (cancel signal), DROP (break and drop item), REMOVE (set to air)
removal-action: FREEZE

# Non-destructive freezing system - temporarily pauses clocks before escalating
freeze:
  enabled: true
  duration-seconds: 15
  max-freeze-attempts: 3

# Adaptive performance scaling - adjusts thresholds dynamically based on MSPT and TPS
adaptive:
  enabled: true
  target-mspt: 40.0
  min-tps: 18.0
  healthy-headroom-multiplier: 1.5

# Clock fingerprinting - distinguishes periodic clocks from bursty sorting systems
fingerprint:
  enabled: true
  clock-strictness: 0.7

# Player proximity throttling - enforces stricter limits on unattended redstone
proximity:
  enabled: true
  player-radius: 96
  unattended-strict-multiplier: 0.6

# Lockdown system (EMP) - Prevents players from repeatedly triggering lag machines
lockdown:
  enabled: true
  # Duration in seconds to lock down the chunk when the threshold is exceeded
  duration-seconds: 60

# Warning system - warn players before removing their redstone
warning:
  enabled: true
  # Percentage of threshold at which to warn (e.g., 80 = warn at 80% of threshold)
  threshold-percent: 80

# Worlds where the plugin is active (use * for all worlds)
enabled-worlds:
  - "*"

# Whitelist mode - only monitor specific chunks instead of all chunks
whitelist:
  enabled: false
  chunks:
    - "world:0:0"

# Alert settings
alerts:
  enabled: true
  log-to-console: true

# Advanced logging system
logging:
  enabled: true
  console-mirror: false
  max-files: 10
  max-size-mb: 10
  performance-stats: true

# Redstone components to monitor
redstone-components:
  - REDSTONE_WIRE
  - REPEATER
  - COMPARATOR
  - OBSERVER
  - PISTON
  - STICKY_PISTON
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - LEVER
  - DAYLIGHT_DETECTOR
  - TARGET
  - TRAPPED_CHEST
  - DROPPER
  - DISPENSER
  - HOPPER
  - CRAFTER
  - COPPER_BULB
  - EXPOSED_COPPER_BULB
  - WEATHERED_COPPER_BULB
  - OXIDIZED_COPPER_BULB
  - WAXED_COPPER_BULB
  - WAXED_EXPOSED_COPPER_BULB
  - WAXED_WEATHERED_COPPER_BULB
  - WAXED_OXIDIZED_COPPER_BULB
  - SCULK_SENSOR
  - CALIBRATED_SCULK_SENSOR
  - CHISELED_BOOKSHELF