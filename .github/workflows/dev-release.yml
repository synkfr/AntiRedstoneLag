name: Dev Pre-Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -B

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: "AntiRedstoneLag Latest Dev Build (v${{ steps.get_version.outputs.VERSION }})"
          body: |
            ## AntiRedstoneLag Latest Development Build
            
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Branch:** `${{ github.ref_name }}`
            **Built at:** `${{ github.event.head_commit.timestamp }}`
            
            > This is an automated rolling development build that always points to the latest commit on `master`.
            
            ### 🛠 Latest Commit Message
            ```
            ${{ github.event.head_commit.message }}
            ```
          prerelease: true
          make_latest: false
          files: target/AntiRedstoneLag-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
