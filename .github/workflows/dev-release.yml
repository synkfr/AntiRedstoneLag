name: Dev Pre-Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -B

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-b${{ github.run_number }}
          name: "Development Build #${{ github.run_number }} (v${{ steps.get_version.outputs.VERSION }})"
          body: |
            ## Development Build #${{ github.run_number }}
            
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            
            This is an automated development build for testing purposes. It reflects the latest changes on the `master` branch.
            
            ### 🛠 Changes in this build
            ${{ github.event.head_commit.message }}
          prerelease: true
          files: target/AntiRedstoneLag-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
